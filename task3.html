
<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>

        body {
            font-family: Arial;
        }

        .container {
            display: flex;
        }

        .sidebar {
            background-color: goldenrod;
            color: white;
            padding: 15px;
            width: 150px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 25px;
        }

        
        .main {
            padding: 15px;
        }

       
        .product {
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
            width: 200px;
        }

        
        .blogs {
            display: flex;
        }

        .blog {
            background-color: lightblue;
            border: 1px solid black;
            padding: 15px;
            margin: 40px;
        }

       
        @media (max-width: 600px) {

            .container {
                flex-direction: column;
            }

            .blogs {
                flex-direction: column;
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <div class="sidebar">
            <h2>Menu</h2>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

        <div class="main">

            <h1>My Website</h1>

            <div class="product">
                <h2>Mobile Phone</h2>
                <p>GLA Mobile Phone Company</p>
                <h3>Price: ₹9999</h3>
                <button>Buy Now</button>
            </div>

            <h1>Our Blogs</h1>

            <div class="blogs">

                <div class="blog">
                    <h3>Blog 1</h3>
                    <p>First blog.</p>
                </div>

                <div class="blog">
                    <h3>Blog 2</h3>
                    <p>Second blog.</p>
                </div>

                <div class="blog">
                    <h3>Blog 3</h3>
                    <p>Third blog.</p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
